<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/icons/icon-512.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "PlaceOfWorship",
    "name": "{{ site.title }}",
    "description": "{{ site.description }}",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{ site.address }}",
      "addressLocality": "{{ site.locality }}",
      "addressRegion": "{{ site.region }}",
      "addressCountry": "JP"
    },
    "telephone": "{{ site.telephone }}",
    "url": "{{ site.url }}{{ site.baseurl }}/"
  }
  </script>
</head>
<body>
  {% include header.html %}
  <main class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
