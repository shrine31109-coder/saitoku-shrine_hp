---
layout: default
---
<article class="post">
  <p class="post__date">{{ page.date | date: "%Y年%m月%d日" }}</p>
  <h1 class="post__title">{{ page.title }}</h1>
  <div class="post__body">
    {% if page.draft %}
      <p class="rites-note">只今作成中です。公開までもうしばらくお待ちください。</p>
    {% else %}
      {{ content }}
    {% endif %}
  </div>
  <p class="post__back"><a href="{{ '/news.html' | relative_url }}">&larr; お知らせ一覧に戻る</a></p>
</article>
